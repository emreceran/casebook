<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casebook</title>
<meta name="description" content="A business problem every day, and how it was solved.">
<link rel="stylesheet" href="stil.css">
<script>
(function () {
  var diller = ["tr", "en", "de", "es", "fr"], secilen = null;
  try { secilen = localStorage.getItem('casebook:dil'); } catch (hata) {}
  if (diller.indexOf(secilen) === -1) {
    secilen = 'en';
    var tercih = navigator.languages || [navigator.language || 'en'];
    for (var i = 0; i < tercih.length; i++) {
      var kod = String(tercih[i]).slice(0, 2).toLowerCase();
      if (diller.indexOf(kod) !== -1) { secilen = kod; break; }
    }
  }
  location.replace(secilen + '/v2/index.html');
})();
</script>
</head>
<body>

</body>
</html>
